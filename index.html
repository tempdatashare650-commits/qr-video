<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Watch Video</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #video-wrapper {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video, iframe {
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
      background: #000;
    }
    /* Tap to play overlay */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .play-btn {
      width: 86px;
      height: 86px;
      background: #2563eb;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(37, 99, 235, 0.6);
      animation: pulse 2s infinite ease-in-out;
      margin-bottom: 20px;
    }
    .play-btn svg {
      width: 42px;
      height: 42px;
      fill: #ffffff;
      margin-left: 6px;
    }
    .prompt-text {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-align: center;
      padding: 0 20px;
    }
    .sub-text {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 6px;
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 20px rgba(37, 99, 235, 0.5); }
      50% { transform: scale(1.08); box-shadow: 0 0 40px rgba(37, 99, 235, 0.8); }
      100% { transform: scale(1); box-shadow: 0 0 20px rgba(37, 99, 235, 0.5); }
    }
  </style>
</head>
<body>

  <div id="video-wrapper">
    <div id="overlay" onclick="startPlayback()">
      <div class="play-btn">
        <svg viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>
      <div class="prompt-text">Tap anywhere to play</div>
      <div class="sub-text">Opens in full screen with sound</div>
    </div>

    <div id="player-container" style="width:100%; height:100%;"></div>
  </div>

  <script>
    // Reads URL parameters dynamically:
    // ?v=filename.mp4  (e.g., ?v=video.mp4 or ?v=1.mp4)
    // ?yt=YOUTUBE_ID   (e.g., ?yt=dQw4w9WgXcQ)
    // ?drive=DRIVE_ID  (e.g., ?drive=1A2B3C4D5E6F7G8H9I)
    const urlParams = new URLSearchParams(window.location.search);
    const videoFile = urlParams.get('v') || 'video.mp4';
    const ytId = urlParams.get('yt');
    const driveId = urlParams.get('drive');

    const overlay = document.getElementById('overlay');
    const container = document.getElementById('player-container');
    let ytPlayer = null;
    let html5Player = null;

    function enterFullscreen(element) {
      if (element.webkitEnterFullscreen) {
        element.webkitEnterFullscreen();
      } else if (element.requestFullscreen) {
        element.requestFullscreen().catch(() => {});
      } else if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (document.documentElement.webkitRequestFullscreen) {
        document.documentElement.webkitRequestFullscreen();
      }
    }

    if (ytId) {
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);

      window.onYouTubeIframeAPIReady = function() {
        container.innerHTML = '<div id="yt-frame" style="width:100%;height:100%;"></div>';
        ytPlayer = new YT.Player('yt-frame', {
          videoId: ytId,
          playerVars: {
            autoplay: 0,
            controls: 1,
            playsinline: 1,
            rel: 0,
            modestbranding: 1
          }
        });
      };
    } else if (driveId) {
      container.innerHTML = `
        <video id="drive-video" playsinline webkit-playsinline controls preload="auto" style="width:100%;height:100%;">
          <source src="https://lh3.googleusercontent.com/d/${driveId}" type="video/mp4">
          <source src="https://drive.google.com/uc?export=download&id=${driveId}" type="video/mp4">
        </video>
      `;
      html5Player = document.getElementById('drive-video');
    } else {
      // Local/GitHub file (default video.mp4 or ?v=...)
      const resolvedFile = videoFile.endsWith('.mp4') ? videoFile : `${videoFile}.mp4`;
      container.innerHTML = `
        <video id="local-video" playsinline webkit-playsinline controls preload="auto" style="width:100%;height:100%;">
          <source src="${resolvedFile}" type="video/mp4">
        </video>
      `;
      html5Player = document.getElementById('local-video');
    }

    function startPlayback() {
      overlay.classList.add('hidden');

      if (ytPlayer && ytPlayer.playVideo) {
        ytPlayer.playVideo();
        enterFullscreen(document.getElementById('video-wrapper'));
      } else if (html5Player) {
        html5Player.muted = false;
        html5Player.play().then(() => {
          enterFullscreen(html5Player);
        }).catch(() => {
          html5Player.muted = true;
          html5Player.play();
          enterFullscreen(html5Player);
        });
      }
    }

    // Show replay button when video finishes
    if (html5Player) {
      html5Player.addEventListener('ended', () => {
        overlay.classList.remove('hidden');
        document.querySelector('.prompt-text').textContent = "Tap to replay";
      });
    }
  </script>
</body>
</html>
